<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Home Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="home.css" rel="stylesheet">
</head>
<body style="background-color: lightblue;">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">AirBNB Booking</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="booking.html">Book Your Stay</a></li>
      </ul>
    </div>
  </div>
</nav>

<section class="hero text-center">
    <div>
        <h1 class="display-4 fw-bold">Book your dream holiday</h1>
        <a href="booking.html" class="btn btn-primary btn-lg">Book now</a>
    </div>
</section>

<section class="container my-5">
  <h2 class="text-center mb-4">Explore the Space</h2>

  <div class="row g-4">
    <div class="col-md-4">
        <div class="image-wrapper">
        <img src="images/house-kitchen.avif" alt="Image 1">
        </div>
    </div>
    <div class="col-md-4">
        <div class="image-wrapper">
        <img src="images/house-bedroom.avif" alt="Image 2">
        </div>
    </div>
    <div class="col-md-4">
        <div class="image-wrapper">
        <img src="images/house-front.avif" alt="Image 3">
        </div>
    </div>
    </div>


  </div>
</section>
<div class = 'text-center'>
<h2>Leave a Review</h2>
<div class="align-top">
<textarea id="reviewText" placeholder="Write your review..." width="15%"></textarea>

<select id="reviewRating">
  <option value="">Rating</option>
  <option value="1">1 ⭐</option>
  <option value="2">2 ⭐</option>
  <option value="3">3 ⭐</option>
  <option value="4">4 ⭐</option>
  <option value="5">5 ⭐</option>
</select>

<button id="submitReview">Submit Review</button>
</div>
<hr>

<h2>Reviews:</h2>
<div id="reviewsContainer"></div>
</div>
<footer class="bg-dark text-white text-center py-3">
  <p class="mb-0"> Airbnb Booking Website</p>
</footer>

<script src="home.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
