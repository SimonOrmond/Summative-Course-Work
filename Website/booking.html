<html>
<title>Home Page</title>
<head>
<link href="booking.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand">AirBNB booking website</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="Home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href=#>Book your stay!</a></li>         
        </ul>
      </div>
    </div>
  </nav>
<div class="month">

<div class="container mt-4">
  
  <div class="row align-items-center text-center py-3"
       style="background-color: #64c5ab; color: white;">

   
    <div class="col-2 text-start">
      <button class="btn btn-outline-light" id="year_prev">&laquo; Year</button>
    </div>


    <div class="col-2 text-start">
      <button class="btn btn-outline-light" id="month_prev">&lsaquo; Month</button>
    </div>


    <div class="col-4">
      <h3 class="m-0 fw-bold" id="month">December </h3>
      <h3 class="m-0 fw-bold" id="year">2025</h3>

    </div>


    <div class="col-2 text-end">
      <button class="btn btn-outline-light" id="month_next">Month &rsaquo;</button>
    </div>


    <div class="col-2 text-end">
      <button class="btn btn-outline-light" id="year_next">Year &raquo;</button>
      
    </div>
    
  </div>

  <div class="row align-items-center text-center py-3"
       style="background-color: #64c5ab; color: white;">
    <div class="col">
      <ul class="weekdays">
        <li>Su</li>
        <li>Mo</li>
        <li>Tu</li>
        <li>We</li>
        <li>Th</li>
        <li>Fr</li>
        <li>Sa</li> 
      </ul>  
      <div id = 'calendar'>
        <ul id="days">
      
        </ul>
      </div>
      <div class="btn-group" role="group">
        <button id="clear_dates"  type="button">CLEAR DATES</button>
        <button id="confirm_dates" type="button">CONFIRM DATES</button>
      </div>
    </div>
  </div>
</div>

</div>
  


<script src="booking.js"></script>
</body>
</html>
