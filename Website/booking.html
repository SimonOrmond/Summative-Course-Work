<html>
<title>Home Page</title>
<head>
<link href="booking.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: lightblue;">
  
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand">AirBNB booking website</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href=#>Book your stay!</a></li>         
        </ul>
      </div>
    </div>
  </nav>

<div class="container mt-5">
  <div class="row">
    <div class="col-lg-8 col-md-12 mb-4">
      <div class="card card-custom-bg shadow-sm h-100">
        <div class="card-body">
    <div class="month">

    <div class="container mt-4">
      
      <div class="row align-items-center text-center py-3"
          style="background-color: lightblue; color: white;">

      
        <div class="col-2 text-start">
          <button class="btn btn-outline-light" id="year_prev">&laquo; Year</button>
        </div>


        <div class="col-2 text-start">
          <button class="btn btn-outline-light" id="month_prev">&lsaquo; Month</button>
        </div>


        <div class="col-4">
          <h3 class="m-0 fw-bold" id="month">December </h3>
          <h3 class="m-0 fw-bold" id="year">2025</h3>

        </div>


        <div class="col-2 text-end">
          <button class="btn btn-outline-light" id="month_next">Month &rsaquo;</button>
        </div>


        <div class="col-2 text-end">
          <button class="btn btn-outline-light" id="year_next">Year &raquo;</button>
          
        </div>
        
      </div>

      <div class="row align-items-center text-center py-3"
          style="background-color: lightblue; color: white;">
        <div class="col">
          <ul class="weekdays">
            <li>Su</li>
            <li>Mo</li>
            <li>Tu</li>
            <li>We</li>
            <li>Th</li>
            <li>Fr</li>
            <li>Sa</li> 
          </ul>  
          <div id = 'calendar'>
            <ul id="days">
          
            </ul>
          </div>
          <div class="btn-group" role="group">
            <button id="clear_dates"  type="button">CLEAR DATES</button>
          </div>
        </div>
      </div>
    </div>
    </div>
    </div>
    </div>

</div>
<div class="col-lg-4 col-md-12 mb-4">
      <div class="card h-100">
        <div class="card-body">
          <h4 class="card-title mb-3">Your Information</h4>
          <form id="Form" novalidate>
            <div class="row mb-3">
              <div class="col">
                <label class="form-label">First Name</label>
                <input type="text" class="form-control" id="firstName" required />
                <div class="invalid-feedback">First name is required.</div>
              </div>
              <div class="col">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lastName" required />
                <div class="invalid-feedback">Last name is required.</div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="email" required />
              <div class="invalid-feedback">Please enter a valid email.</div>
            </div>

            <div class="mb-3">
              <label class="form-label">Phone</label>
              <input type="tel" class="form-control" id="phone" required />
              <div class="invalid-feedback">Phone number is required.</div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Submit</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
  
<script src="booking.js"></script>
<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
</body>
</html>
